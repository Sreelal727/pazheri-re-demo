<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pazheri Properties — Sales & Legal ERP</title>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div class="app">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">P</div>
      <div><b>Pazheri Properties</b><span>Sales &amp; Legal ERP</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      Demo build · v1.0<br>Live status tracking across all 6 departments.
    </div>
  </aside>

  <!-- Main -->
  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="18" height="18"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <div>
        <div class="page-title" id="pageTitle">Dashboard</div>
        <div class="page-sub" id="pageSub"></div>
      </div>

      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="globalSearch" placeholder="Search customer, plot no. or project…" autocomplete="off">
      </div>

      <div class="notif-wrap">
        <button class="icon-btn" id="bellBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          <span id="bellDot"></span>
        </button>
        <div class="notif-panel" id="notifPanel"></div>
      </div>

      <div class="notif-wrap">
        <button class="role-switch" id="roleBtn"></button>
        <div class="role-menu" id="roleMenu"></div>
      </div>
    </header>

    <main class="content">
      <section class="view" id="view-dashboard"></section>
      <section class="view" id="view-plots"></section>
      <section class="view" id="view-legal"></section>
      <section class="view" id="view-finance"></section>
      <section class="view" id="view-activity"></section>
      <section class="view" id="view-departments"></section>
    </main>
  </div>
</div>

<!-- Plot detail drawer -->
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer">
  <div class="d-head" id="drawerHead"></div>
  <div class="d-body" id="drawerBody"></div>
</aside>

<!-- Update modal -->
<div class="modal-scrim" id="modalScrim"></div>

<!-- Toasts -->
<div class="toast-wrap" id="toastWrap"></div>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
