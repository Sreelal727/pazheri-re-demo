<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pazheri Properties — Sales, Legal &amp; Business ERP</title>
<link rel="stylesheet" href="assets/styles.css">
<link rel="stylesheet" href="assets/styles-modules.css">
</head>
<body>
<div class="app">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo" title="Pazheri Properties">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 11.5 12 4l9 7.5"/>
          <path d="M5.5 10.5V20h13v-9.5"/>
          <path d="M10 20v-5.5h4V20"/>
        </svg>
      </div>
      <div><b>Pazheri Properties</b><span>Business ERP</span></div>
    </div>

    <nav class="nav" id="nav"></nav>

    <div class="side-foot">
      <div class="side-user" id="sideUser"></div>
      <div class="side-ver">Demo build · v2.0 · 33 modules live</div>
    </div>
  </aside>

  <!-- Main -->
  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="18" height="18"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div class="page-id">
        <div class="crumb" id="crumb"></div>
        <div class="page-title" id="pageTitle">Command Centre</div>
        <div class="page-sub" id="pageSub"></div>
      </div>

      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="globalSearch" placeholder="Search customer, plot no. or project…" autocomplete="off">
      </div>

      <button class="tour-btn" id="tourBtn" title="Take a guided tour of the system">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l6-3.5z"/></svg>
        <span>Take a tour</span>
      </button>

      <button class="period-btn" id="periodBtn" data-demo="Switch the reporting period for every dashboard."></button>

      <div class="notif-wrap">
        <button class="icon-btn" id="bellBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          <span id="bellDot"></span>
        </button>
        <div class="notif-panel" id="notifPanel"></div>
      </div>

      <div class="notif-wrap">
        <button class="role-switch" id="roleBtn"></button>
        <div class="role-menu" id="roleMenu"></div>
      </div>
    </header>

    <main class="content"></main>
  </div>
</div>

<!-- Plot detail drawer -->
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer">
  <div class="d-head" id="drawerHead"></div>
  <div class="d-body" id="drawerBody"></div>
</aside>

<div class="modal-scrim" id="modalScrim"></div>
<div class="viewer-scrim" id="viewerScrim"></div>
<input type="file" id="fileInput" accept="image/*,application/pdf,.doc,.docx,.xls,.xlsx" style="display:none">
<div class="toast-wrap" id="toastWrap"></div>

<!-- Core layer -->
<script src="assets/lib/core.js"></script>
<script src="assets/data.js"></script>
<script src="assets/data-extra.js"></script>
<script src="assets/lib/charts.js"></script>
<script src="assets/lib/docs.js"></script>
<script src="assets/lib/build.js"></script>
<script src="assets/lib/nav.js"></script>
<script src="assets/lib/tour-steps.js"></script>
<script src="assets/lib/tour.js"></script>

<!-- Screens -->
<script src="assets/views/core.js"></script>
<script src="assets/views/exec.js"></script>
<script src="assets/views/finance.js"></script>
<script src="assets/views/sales.js"></script>
<script src="assets/views/inventory.js"></script>
<script src="assets/views/legal.js"></script>
<script src="assets/views/ops.js"></script>
<script src="assets/views/people.js"></script>
<script src="assets/views/governance.js"></script>

<!-- Shell (boots the app) -->
<script src="assets/app.js"></script>
</body>
</html>
